name: Deploy to Hugging Face Spaces

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,tft]"
      - name: Generate HF Space mirror
        run: python scripts/seed_hf_space.py
      - name: Configure git for HF push
        run: |
          git config --global user.email "ci@marketpulse"
          git config --global user.name "MarketPulse CI"
      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: mashraf
          HF_SPACE_NAME: marketpulse
        run: |
          cd hf_space
          git init
          git lfs install
          git remote add hf https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}
          git add -A
          git commit -m "release: ${GITHUB_REF_NAME}"
          git push --force hf main
