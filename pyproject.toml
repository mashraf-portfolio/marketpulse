[project]
name = "marketpulse"
version = "0.1.0"
description = "Multi-task financial forecasting: price/direction, volatility, regime — across 23 tickers in 8 markets"
authors = [{ name = "Mohammad Ashraf Ahmed Hafez", email = "mashraff2024@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
  "fastapi==0.135.1",
  "uvicorn[standard]==0.29.0",
  "yfinance==0.2.66",
  "pandas==2.2.2",
  "numpy==1.26.4",
  "scipy==1.15.3",
  "ta==0.11.0",
  "scikit-learn==1.4.2",
  "statsmodels==0.14.2",
  "pmdarima==2.0.4",
  "prophet==1.1.5",
  "cmdstanpy==1.2.5",
  "arch==7.0.0",
  "hmmlearn==0.3.2",
  "xgboost==2.0.3",
  "optuna==3.6.1",
  "tensorflow==2.16.1",
  "joblib==1.4.2",
  "pydantic==2.7.1",
  "pyyaml==6.0.1",
  "plotly==5.22.0",
  "gradio==5.50.0",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
tft = [
  "torch==2.2.2",
  "pytorch-lightning==2.2.4",
  "pytorch-forecasting==1.4.0",
]
dev = [
  "ruff==0.9.3",
  "pytest==8.2.0",
  "pytest-cov==5.0.0",
  "httpx==0.27.0",
  "pre-commit==3.7.0",
  "gradio-client==1.14.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "."}

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/cache", "models/checkpoints", "hf_space"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers -m 'not slow'"
markers = ["slow: marks tests as slow — run with -m slow (skipped by default)"]
